# MediaTek profile
# thermal_core is the userspace thermal policy daemon. It pushes kernel clock
# limits through the power HAL, which is why disabling thermal zones alone does
# not stop throttling on MTK.
PROFILE_NAME="MediaTek"
SVC_THERMAL="thermal_core vendor.thermal_core"
SVC_POWER=""
ZONES_DISABLE="cpu_* gpu* soc*"
GUARD_SOC=80000
GUARD_BAT=47000
GPU_MIN_PCT=50
